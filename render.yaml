services:
  - type: web
    name: vinayak-procurement-agent
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_URL
        sync: false
