services:
  - type: web
    name: vinayak-procurement-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
