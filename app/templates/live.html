{% extends "base.html" %}{% block body %}
<style>
.hd{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.pill2{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:99px;font-size:13px;border:1px solid var(--line);background:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:#bbb}.dot.live{background:#16a34a;animation:blink 1.2s infinite}.dot.wait{background:#d97706;animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.35}}
.msg{background:#d9fdd3;border-radius:12px 12px 2px 12px;padding:9px 14px;max-width:560px;margin:10px 0 6px auto;font-size:14px;animation:rise .35s}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.flows{display:flex;gap:8px;overflow-x:auto;margin:8px 0}.fl{min-width:170px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px 10px;font-size:12px;animation:rise .4s}.fl.on{border-color:#4f46e5;box-shadow:0 0 0 2px rgba(79,70,229,.12)}.fl i{display:block;height:4px;border-radius:2px;background:#4f46e5;margin-top:5px;transition:width .6s}
svg.cv{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
.nd rect{transition:all .35s}.nd .t1{font:500 14px var(--font-sans,system-ui);fill:#3d3d3a}.nd .t2{font:12px var(--font-sans,system-ui);fill:#6b6560}
.nd.pending rect{fill:#f4efe7;stroke:#d3cdc3}.nd.pending{opacity:.55}
.nd.active rect{fill:#e0e7ff;stroke:#4f46e5;stroke-width:1.5;animation:pulse 1.3s infinite}.nd.waiting rect{fill:#fef3c7;stroke:#d97706;stroke-width:1.5;animation:pulse 1.3s infinite}
.nd.done rect{fill:#dcfce7;stroke:#16a34a}.nd.skipped rect{fill:#f1f5f9;stroke:#94a3b8;stroke-dasharray:4 3}
@keyframes pulse{50%{stroke-opacity:.35}}.nd .ck{font:600 13px system-ui;fill:#15803d}
.ar{stroke:#b9b2a6;fill:none;stroke-width:1.5}.ar.flow{stroke:#4f46e5;stroke-dasharray:6 5;animation:dash .8s linear infinite}.ar.dn{stroke:#16a34a}@keyframes dash{to{stroke-dashoffset:-11}}
.vn rect{fill:#f4efe7;stroke:#d3cdc3;transition:all .4s}.vn text{font:11.5px system-ui;fill:#3d3d3a}.vn.replied rect{fill:#dcfce7;stroke:#16a34a}.vn.chased rect{fill:#fef3c7;stroke:#d97706}.vn.asked rect{fill:#e0e7ff;stroke:#818cf8}.vn{animation:rise .4s both}
.now{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:12px;box-shadow:var(--shadow)}.now h3{margin:0 0 4px;font-size:15px}
.ck{display:flex;gap:8px;font-size:13.5px;margin:5px 0}.ck b{width:16px;text-align:center}.ck.new{animation:rise .4s both}.ok{color:#15803d}.wn{color:#b45309}.no{color:#b91c1c}.tag{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:0 8px;color:var(--mut)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:3px 10px;font-size:13.5px;margin:8px 0;background:#faf7f2;border-radius:8px;padding:8px 10px}.kv span:nth-child(odd){color:var(--mut)}
.mini{width:100%;font-size:13px;margin-top:8px;border-radius:8px;box-shadow:none;border:1px solid var(--line)}.mini th,.mini td{padding:4px 8px}
.bars .row{display:grid;grid-template-columns:150px 1fr 50px;gap:8px;align-items:center;margin:6px 0;font-size:13px}.bars .track{height:12px;background:#efe9df;border-radius:6px;overflow:hidden;display:flex}.bars .track i{display:block;height:100%}
.hm{white-space:pre-wrap;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}.sm{color:var(--mut);font-size:13px}
.log{font-size:12px;color:var(--mut);margin-top:14px}.log div{margin:2px 0}
.grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:16px;align-items:start}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.wa{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#efeae2;position:sticky;top:112px;box-shadow:var(--shadow)}.wah{background:#075e54;color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;font-size:14px}.wah .sm{color:#cfe9e5}
.av{width:32px;height:32px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;font-weight:600}.wam{padding:10px;max-height:560px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.b{max-width:90%;padding:7px 10px;border-radius:9px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(0,0,0,.12);animation:rise .35s}.b.agent{background:#fff;align-self:flex-start}.b.engineer{background:#d9fdd3;align-self:flex-end}.b.hod{background:#cfe8ff;align-self:flex-end}
.b .w{font-size:11px;color:#667781;margin-bottom:2px}.b.demo{align-self:center;background:#fff3cd;font-size:11.5px;color:#7a5b00;text-align:center}.b .t{font-size:10px;color:#667781;text-align:right}.b.choice{font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}.stat b{display:block;font-size:20px;line-height:1.2}.stat span{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}.bar2{height:5px;background:#efe9df;border-radius:3px;margin-top:5px;overflow:hidden}.bar2 i{display:block;height:100%;background:#16a34a;transition:width .6s}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.idle{background:#fff;border:1px dashed #c9c2b6;border-radius:12px;padding:14px 16px;margin-top:12px;font-size:14px}.req{font-size:15px;margin:6px 0 2px}.req b{font-weight:600}
.cvh{font:11px system-ui;fill:#8a8578;letter-spacing:.04em}
</style>
<div class="hd"><h1 style="margin:0">Live flow</h1><span class="pill2" id="status"><span class="dot"></span><span>connecting</span></span><span class="sm" id="age"></span></div>
<div class="req" id="bubble"></div>
<div class="sm">Driven from WhatsApp (agent +91 89811 07767). This page only watches: nodes fill in from what the agent actually did.</div>
<div class="stats" id="stats"></div><div class="flows" id="flows"></div>
<div class="grid2"><div><svg class="cv" id="cv" viewBox="0 0 680 210" role="img" aria-label="Live flow of the current requirement"></svg>
<div class="now" id="now"></div><div class="log" id="log"></div></div>
<div class="wa"><div class="wah"><span class="av">V</span><div><b>Site team group</b><div class="sm" style="font-size:11px">WhatsApp · the agent is a member</div></div></div><div class="wam" id="wam"><div class="sm" style="text-align:center;margin-top:30px">Messages appear here as they happen</div></div></div></div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const W=120,H=56,POS={capture:[12,24],clarify:[146,24],item:[280,24],stock:[414,24],rfq:[548,24],quotes:[548,134],compare:[414,134],hod:[280,134],outcome:[146,134]};
const NAME={capture:'Capture',clarify:'Ask, confirm',item:'Match code',stock:'Check stock',rfq:'Send RFQs',quotes:'Read quotes',compare:'Rank vendors',hod:'Admins decide',outcome:'Outcome'};
const KEYS=Object.keys(POS);
let seen=new Set(),lastKey='',cur=null,sig='';
function trunc(t,n){t=t||'';return t.length>n?t.slice(0,n-1)+'…':t}
function paint(j){const S={};j.steps.forEach(s=>S[s.key]=s);const V=(j.vendors||[]).slice(0,8);const vh=V.length?250+Math.ceil(V.length/4)*34:206;$('cv').setAttribute('viewBox',`0 0 680 ${vh}`);
 let h='<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8a8578" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>';
 h+=`<text class="cvh" x="12" y="14">CASE #${j.case_id||'–'} · ${esc((j.channel||'').toUpperCase())}</text>`;
 for(let i=0;i<KEYS.length-1;i++){const a=KEYS[i],b=KEYS[i+1],[x1,y1]=POS[a],[x2,y2]=POS[b],sa=S[a].status,sb=S[b].status;
  const cls='ar '+((sa==='done'||sa==='skipped')&&(sb==='active'||sb==='waiting')?'flow':((sa==='done'||sa==='skipped')&&(sb==='done'||sb==='skipped')?'dn':''));
  const d=y1!==y2?`M${x1+W/2} ${y1+H} L${x2+W/2} ${y2-2}`:(x2>x1?`M${x1+W} ${y1+H/2} L${x2-2} ${y2+H/2}`:`M${x1} ${y1+H/2} L${x2+W+2} ${y2+H/2}`);
  h+=`<path class="${cls}" d="${d}" marker-end="url(#ah)"/>`;}
 if(V.length){h+=`<text class="cvh" x="12" y="${232}">VENDORS · ${V.filter(v=>v.state==='replied').length} OF ${V.length} REPLIED</text>`;
  V.forEach((v,i)=>{const x=12+(i%4)*167,y=242+Math.floor(i/4)*34;h+=`<path class="ar ${v.state==='replied'?'dn':'flow'}" stroke-width="1" d="M${POS.quotes[0]+W/2} ${POS.quotes[1]+H} L${x+75} ${y}"/>`;});
  V.forEach((v,i)=>{const x=12+(i%4)*167,y=242+Math.floor(i/4)*34;h+=`<g class="vn ${v.state}" style="animation-delay:${i*90}ms"><rect x="${x}" y="${y}" width="155" height="26" rx="6" stroke-width="0.8"/><text x="${x+8}" y="${y+17}">${esc(trunc(v.name,12))}${v.landed?' · '+esc(v.landed):(v.state==='chased'?' · chased':' · waiting')}</text></g>`;});}
 for(const k of KEYS){const [x,y]=POS[k];const s=S[k];const sub=s.status==='pending'?'':trunc(s.sub||'',19);
  h+=`<g class="nd ${s.status}"><rect x="${x}" y="${y}" width="${W}" height="${H}" rx="8" stroke-width="0.8"/><text class="t1" x="${x+W/2}" y="${y+(sub?22:33)}" text-anchor="middle">${esc(NAME[k])}</text>${sub?`<text class="t2" x="${x+W/2}" y="${y+42}" text-anchor="middle">${esc(sub)}</text>`:''}${s.status==='done'?`<text class="ck" x="${x+W-12}" y="${y+15}" text-anchor="middle">✓</text>`:''}</g>`;}
 $('cv').innerHTML=h;}
function checkHTML(c,key,i){const id=key+'|'+c.text;const n=!seen.has(id);seen.add(id);const cls=c.ok===true?'ok':(c.ok===false?'no':'wn');return `<div class="ck ${n?'new':''}" style="animation-delay:${n?(i%6)*60:0}ms"><b class="${cls}">${c.ok===true?'✓':(c.ok===false?'✗':'!')}</b><span>${esc(c.text)}${c.tag?` <span class="tag">${esc(c.tag)}</span>`:''}</span></div>`}
function dataHTML(d){if(!d)return'';let h='';if(d.kv)h+='<div class="kv">'+d.kv.filter(x=>x[1]).map(x=>`<span>${esc(x[0])}</span><span>${esc(x[1])}</span>`).join('')+'</div>';
 if(d.table)h+=`<table class="mini"><tr>${d.table.head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${d.table.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table>`;
 if(d.bars)h+='<div class="bars">'+d.bars.map((b,i)=>`<div class="row"><span>${i+1}. ${esc(b.label)}</span><div class="track" title="${esc(b.note)}"><i style="width:${b.price}%;background:#4f46e5"></i><i style="width:${b.hist}%;background:#16a34a"></i><i style="width:${b.terms}%;background:#d97706"></i></div><b>${b.value}</b></div><div class="sm" style="margin:-2px 0 4px 158px">${esc(b.note)}</div>`).join('')+'</div>';
 if(d.message){h+=`<div class="hm">${esc(d.message)}</div>`;if((d.options||[]).length)h+='<div class="sm" style="margin-top:8px">Admins reply in their private WhatsApp message: '+d.options.map((o,i)=>(i+1)+' = '+esc(o.label)).join(' · ')+'</div>';}return h}
function now(j){const order=j.steps;let f=order.find(s=>s.status==='waiting')||order.find(s=>s.status==='active');if(!f){const d=order.filter(s=>s.status==='done');f=d[d.length-1]}if(!f)return;
 const idx=order.indexOf(f)+1;$('now').innerHTML=`<h3>${idx}. ${esc(f.title)} <span class="sm">${esc(f.summary||'')}</span></h3>`+f.checks.map((c,i)=>checkHTML(c,f.key,i)).join('')+dataHTML(f.data);}
let chatSig='';function chat(j){const sg=JSON.stringify(j.chat||[]);if(sg===chatSig)return;chatSig=sg;const el=$('wam');const atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<60;el.innerHTML=(j.chat||[]).map(m=>{const who=m.who==='agent'?'Procurement agent'+(m.to==='hod'?' → admins':''):(m.who==='hod'?'Admin':(m.who==='engineer'?'Site engineer':''));return `<div class="b ${m.who} ${m.choice?'choice':''}">${who?`<div class="w">${who}</div>`:''}${esc(m.text)}<div class="t">${esc(m.ts)}</div></div>`}).join('')||'<div class="sm" style="text-align:center;margin-top:30px">Messages appear here as they happen</div>';if(atBottom)el.scrollTop=el.scrollHeight}
function stats(j){const st=j?j.steps:[];const done=st.filter(x=>x.status==='done'||x.status==='skipped').length,V=(j&&j.vendors)||[],rep=V.filter(x=>x.state==='replied').length;
 const cmp=st.find(x=>x.key==='compare'),top=cmp&&cmp.summary?cmp.summary.replace('Top: ',''):'–';
 const el=(j&&j.started)?Math.max(0,Math.round(j.started)):0,t=el?Math.floor(el/60)+'m '+String(el%60).padStart(2,'0')+'s':'–';
 $('stats').innerHTML=`<div class="stat"><b>${done} / ${st.length||9}</b><span>steps done</span><div class="bar2"><i style="width:${st.length?100*done/st.length:0}%"></i></div></div><div class="stat"><b>${V.length?rep+' / '+V.length:'–'}</b><span>vendors replied</span></div><div class="stat"><b style="font-size:14px;padding:3px 0">${esc(trunc(top,30))}</b><span>top ranked</span></div><div class="stat"><b>${t}</b><span>elapsed</span></div>`}
const EMPTY={case_id:null,steps:KEYS.map(k=>({key:k,status:'pending',sub:''})),vendors:[]};
function render(j){if(!j.case_id){$('status').innerHTML='<span class="dot"></span><span>idle</span>';$('age').textContent='';$('bubble').innerHTML='<span class="sm">No requirement in the last 30 minutes.</span>';
  if(sig!=='idle'){sig='idle';cur=null;paint(EMPTY);stats(null);chatSig='';$('wam').innerHTML='<div class="sm" style="text-align:center;margin-top:30px">Waiting for a message in the group</div>'}
  $('now').innerHTML='<div class="idle">Post a requirement in the WhatsApp group (text or voice, any language), e.g. <i>"need 200 bags cement at Demo Villas by 15 Dec"</i>. A new flow starts here within a second.</div>';$('log').innerHTML='';return}
 if(j.case_id!==cur){cur=j.case_id;seen=new Set();sig=''}
 $('bubble').innerHTML=`<b>#${j.case_id}</b> “${esc(j.raw)}”`;
 $('age').textContent=j.age<60?'updated just now':'last activity '+Math.round(j.age/60)+' min ago';
 $('status').innerHTML=`<span class="dot ${j.waiting?'wait':(j.state!=='DECIDED'?'live':'')}"></span><span>${esc(j.label)}${j.waiting?' · waiting for '+esc(j.waiting.replace('engineer','the requester').replace('hod','the admins')):''}</span>`;
 const s=JSON.stringify([j.steps.map(x=>x.status+x.sub),j.vendors]);if(s!==sig){sig=s;paint(j)}stats(j);now(j);chat(j);
 $('log').innerHTML=j.error?'<div class="no">Problem: '+esc(j.error)+'</div>':'<b>Agent log</b>'+j.events.map(e=>`<div>${e.ts} · ${esc(e.actor)} · ${esc(e.text)}</div>`).join('')}
async function tick(){try{render(await (await fetch('/api/flow'+location.search)).json())}catch(e){}}
async function flows(){try{const l=await (await fetch('/api/cases')).json();$('flows').innerHTML=l.length>1?l.slice(0,5).map(c=>`<div class="fl ${c.id===cur?'on':''}"><b>#${c.id}</b> ${esc(trunc(c.raw,38))}<div class="sm" style="font-size:11px">${esc(c.label)}</div><i style="width:${Math.max(6,c.pct)}%"></i></div>`).join(''):''}catch(e){}}
setInterval(tick,1000);setInterval(flows,3000);tick();flows();
</script>{% endblock %}
